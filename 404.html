<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | RapidIdentity</title>
  <script src="/assets/theme-loader.js"></script>
  <link rel="stylesheet" href="/">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top, rgba(108, 99, 255, 0.08), transparent 55%), var(--bg);
    }

    .not-found-shell {
      width: min(560px, 100%);
      padding: 2.5rem 2rem;
      text-align: center;
      background: rgba(12, 13, 25, 0.72);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .not-found-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      padding: 0.45rem 0.9rem;
      margin-bottom: 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .not-found-shell h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, #fff 25%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .not-found-shell p {
      margin: 1rem auto 0;
      max-width: 30rem;
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 1rem;
    }

    .not-found-actions {
      margin-top: 1.75rem;
      display: flex;
      justify-content: center;
    }

    .btn-primary {
      padding: 12px 24px;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .not-found-shell {
        padding: 2rem 1.25rem;
        border-radius: 20px;
      }
    }
  </style>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>
<body>
  <main class="not-found-shell" role="main" aria-labelledby="not-found-title">
    <div class="not-found-badge">Error 404</div>
    <h1 id="not-found-title">Page not found</h1>
    <p>The page you were looking for does not exist or was moved. Use the button below to go back to the main site.</p>
    <div class="not-found-actions">
      <a class="btn-primary" href="/">Go back</a>
    </div>
  </main>
</body>
</html>
