<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Omoggle | CarsonGames</title>

  <script src="../assets/theme-loader.js"></script>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="peerjs.min.js"></script>

  <link rel="icon" href="/assets/favicon.ico">

  <style>
    /* Omoggle-only fixes. Nothing here changes the shared stylesheet. */
    .showdown-container{
      width:100%;
      max-width:1000px;
      margin:1rem auto;
      padding:0 1.5rem;
      box-sizing:border-box;
    }

    .showdown-card{
      width:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius-l);
      padding:2rem 1.5rem;
      text-align:center;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:300px;
    }

    .view-stage{
      width:100%;
      display:none;
      flex-direction:column;
      align-items:center;
    }

    .view-stage.active{display:flex}

    .showdown-title{
      font-family:'Outfit',system-ui,sans-serif;
      font-size:2.2rem;
      font-weight:800;
      line-height:1.1;
      margin:0 0 .5rem;
      background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      color:transparent;
    }

    .showdown-desc{
      color:var(--text-muted);
      max-width:500px;
      margin:0 0 1.5rem;
      line-height:1.6;
      font-size:.95rem;
      font-weight:600;
    }

    .status-display-msg{
      color:#ef4444;
      margin-top:1rem;
      font-size:.95rem;
      font-weight:700;
      min-height:1.5rem;
    }

    .radar-spinner{
      width:70px;
      height:70px;
      flex:0 0 auto;
      border:4px solid var(--border);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:omoggle-spin 1s linear infinite;
      margin-bottom:2rem;
    }

    @keyframes omoggle-spin{to{transform:rotate(360deg)}}

    .battleground{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:1.5rem;
      width:100%;
      margin-bottom:1.5rem;
    }

    .player-slot{
      min-width:0;
      background:var(--surface);
      border:2px solid var(--border);
      border-radius:var(--radius-m);
      aspect-ratio:4/3;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      position:relative;
      overflow:hidden;
      isolation:isolate;
    }

    .player-slot.winning{border-color:var(--accent)}

    .player-slot video{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      position:absolute;
      inset:0;
      z-index:1;
      background:var(--surface);
      -webkit-transform:translateZ(0);
      transform:translateZ(0);
    }

    .player-label{
      position:absolute;
      top:12px;
      left:12px;
      background:rgba(0,0,0,.65);
      padding:4px 10px;
      border-radius:4px;
      font-size:.75rem;
      font-weight:800;
      line-height:1.2;
      text-transform:uppercase;
      z-index:3;
      pointer-events:none;
    }

    .player-label.opponent{
      left:auto;
      right:12px;
    }

    .live-metrics{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      margin:0;
      white-space:nowrap;
      background:rgba(0,0,0,.65);
      padding:4px 10px;
      border-radius:4px;
      font-family:'Outfit',system-ui,sans-serif;
      font-weight:800;
      font-size:1.1rem;
      line-height:1.2;
      color:var(--text-muted);
      z-index:3;
      pointer-events:none;
    }

    .winning .live-metrics{color:var(--accent)}

    .timer-banner{
      font-family:'Outfit',system-ui,sans-serif;
      font-size:2.2rem;
      line-height:1;
      font-weight:800;
      color:#fff;
      margin-bottom:1rem;
    }

    .scale-wrapper{
      width:80%;
      max-width:500px;
      margin:0 auto;
      position:relative;
    }

    .scale-labels{
      display:flex;
      justify-content:space-between;
      gap:1rem;
      font-size:.75rem;
      font-weight:800;
      color:var(--text-muted);
      margin-bottom:.4rem;
      text-transform:uppercase;
    }

    .scale-track{
      height:10px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:999px;
      position:relative;
      width:100%;
    }

    .scale-center-notch{
      position:absolute;
      left:50%;
      top:-4px;
      width:2px;
      height:16px;
      background:var(--text-muted);
      transform:translateX(-50%);
    }

    .scale-needle{
      position:absolute;
      top:-6px;
      left:50%;
      width:20px;
      height:20px;
      background:var(--accent);
      border:3px solid #fff;
      border-radius:50%;
      transform:translateX(-50%);
      transition:left .25s ease;
      will-change:left;
    }

    .result-announcement{
      font-family:'Outfit',system-ui,sans-serif;
      font-size:1.8rem;
      line-height:1.15;
      font-weight:800;
      margin:1rem 0 0;
      display:none;
    }

    .action-row{
      margin-top:1.5rem;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    /* iPad/Safari */
    @media (max-width:1100px){
      .showdown-container{padding-left:1rem;padding-right:1rem}
      .showdown-card{padding:1.5rem 1rem}
    }

    @media (max-width:720px){
      .showdown-container{margin:.75rem auto;padding:0 .75rem}
      .showdown-card{padding:1.25rem .75rem}
      .showdown-title{font-size:1.8rem}
      .showdown-desc{font-size:.9rem}
      .battleground{gap:.75rem}
      .player-label{top:8px;left:8px}
      .player-label.opponent{left:auto;right:8px}
      .live-metrics{bottom:8px;font-size:.95rem}
      .scale-wrapper{width:90%}
    }

    @media (max-height:700px){
      .showdown-card{padding:1rem}
      .battleground{gap:.75rem;margin-bottom:.75rem}
      .showdown-title{font-size:1.6rem}
      .showdown-desc{margin-bottom:1rem}
      .action-row{margin-top:1rem}
    }

    @media (prefers-reduced-motion:reduce){
      .radar-spinner{animation:none}
      .scale-needle{transition:none}
    }

    /* Prevent Safari from changing button/input typography. */
    .showdown-card button,
    .showdown-card input{
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      -webkit-appearance:none;
      appearance:none;
    }

    .showdown-card button{
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
  </style>
</head>

<body>
  <header>
    <div class="nav-container">
      <a href="" class="logo">CarsonGames</a>
      <nav>
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../games/">Games</a></li>
          <li><a href="#" class="active">Omoggle</a></li>
          <li><a href="../chat/">Chat</a></li>
          <li><a href="../settings/">Settings</a></li>
          <li id="auth-button-container"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="showdown-container">
    <div class="showdown-card">

      <div id="stage-lobby" class="view-stage active">
        <h2 class="showdown-title">OMOGGLE</h2>
        <p class="showdown-desc">
          COMPETE AGAINST OTHER PEOPLE TO SEE WHO HAS MORE AURA AFTER 15 SECONDS OF LIVE VIDEO
        </p>
        <button id="btn-start" class="btn-primary" type="button">Find a Competitor</button>
        <p id="lobby-msg" class="status-display-msg" aria-live="polite"></p>
      </div>

      <div id="stage-searching" class="view-stage">
        <div class="radar-spinner" aria-hidden="true"></div>
        <h3 class="showdown-title" style="font-size:1.8rem">Finding Competitor...</h3>
        <p class="showdown-desc">Searching for an available match...</p>
        <button id="btn-cancel" class="btn-primary" type="button"
          style="background:var(--surface);border:1px solid var(--border)">
          Cancel Search
        </button>
      </div>

      <div id="stage-match" class="view-stage">
        <div id="countdown" class="timer-banner">15s</div>

        <div class="battleground">
          <div id="slot-user" class="player-slot">
            <span class="player-label">You</span>
            <video id="user-video" autoplay playsinline muted></video>
            <div id="user-aura-val" class="live-metrics">Aura: +500</div>
          </div>

          <div id="slot-opponent" class="player-slot">
            <span class="player-label opponent" id="opponent-name">Unknown</span>
            <video id="opponent-video" autoplay playsinline></video>
            <div id="opp-aura-val" class="live-metrics">Aura: +500</div>
          </div>
        </div>

        <div class="scale-wrapper">
          <div class="scale-labels">
            <span>Your Aura</span>
            <span>Opponent Aura</span>
          </div>
          <div class="scale-track">
            <div class="scale-center-notch"></div>
            <div id="scale-needle" class="scale-needle"></div>
          </div>
        </div>

        <h3 id="result-text" class="result-announcement" aria-live="assertive"></h3>

        <div class="action-row">
          <button id="btn-next" class="btn-primary" type="button" style="display:none">
            Next Match
          </button>
          <button id="btn-exit" class="btn-primary" type="button"
            style="display:none;background:var(--surface);border:1px solid var(--border)">
            Leave
          </button>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    let AuraEngine;
    try {
      const mod = await import("./auraEngine.js");
      AuraEngine = mod.AuraEngine;
      if (!AuraEngine || typeof AuraEngine.calculateMatchFlux !== "function")
        throw new Error("Invalid AuraEngine");
    } catch (e) {
      console.warn("AuraEngine unavailable; using fallback.");
      AuraEngine = {
        calculateMatchFlux(score) {
          const delta = (Math.random() - .5) * 8;
          return Math.max(0, Math.min(100, score + delta));
        }
      };
    }

    const OUTCOME_PHRASES = {
      wonByATon:[
        "BRO GOT VIOLATED 💀","BRO GOT ABSOLUTELY COOKED.","INSANE AURA DIFF.",
        "BRO GOT FARMED FOR AURA.","THAT WAS A VIOLATION 😭","YOU ATE. THEY GOT NO CRUMBS.",
        "BRO GOT OUT-AURA'D.","ABSOLUTE AURA FARM.","THEY ARE COOKED 💀","THAT WAS NOT EVEN CLOSE."
      ],
      won:[
        "W AURA 🔥","YOU COOKED.","COMMON W.","AURA DIFF.","YOU ATE THAT.",
        "CERTIFIED W.","BRO IS LOCKED IN.","MASSIVE W.","YOU'RE COOKING.","CLEAN AURA W."
      ],
      barelyWon:[
        "BARELY A W 😭","YOU LOWKEY COOKED.","THAT WAS WAY TOO CLOSE.",
        "W BY A HAIR.","YOU CLUTCHED THAT.","THE AURA BARELY HELD.","THAT WAS CLOSE 💀",
        "MINOR W.","YOU ALMOST SOLD.","BARELY OUT-AURA'D."
      ],
      tie:[
        "AURA CHECK: TIED.","NO AURA DIFF.","BOTH OF YOU COOKED.","ACTUALLY A 50/50.",
        "THE AURA IS IDENTICAL.","NEITHER OF YOU WON 💀","AURA DEADLOCK.",
        "TOO CLOSE TO CALL.","EQUAL AURA.","NO ONE GOT COOKED."
      ],
      barelyLost:[
        "BARELY AN L 😭","YOU ALMOST COOKED.","THAT WAS SO CLOSE.",
        "YOU SOLD AT THE END 💀","MINOR AURA L.","YOU WERE ONE AURA POINT AWAY.",
        "YOU ALMOST HAD IT.","THAT WAS A CLOSE L.","BRO BARELY SOLD.","JUST MISSED THE W."
      ],
      lost:[
        "L AURA 💀","YOU GOT COOKED.","AURA DIFF.","BRO SOLD.","COMMON L.",
        "YOU GOT OUT-AURA'D.","TIME TO LOCK IN.","MASSIVE AURA L.",
        "YOU GOT VIOLATED.","BRO IS COOKED."
      ],
      lostByATon:[
        "BRO GOT VIOLATED 💀","BRO GOT ABSOLUTELY COOKED.","NEGATIVE AURA IS CRAZY.",
        "THAT WAS AN AURA DISASTER.","YOU GOT FARMED FOR AURA.",
        "BRO SOLD THE WHOLE MATCH 😭","MASSIVE AURA L.","PLEASE LOCK IN.",
        "THAT WAS NOT EVEN A CONTEST.","BRO GOT OBLITERATED 💀",
        "ABSOLUTE VIOLATION.","THE AURA GAP IS INSANE."
      ]
    };

    const supabase = createClient(
      "https://hbynnertatvxpvtqctyg.supabase.co",
      "sb_publishable_WnnU16Mfj1rmRJcEStOzeQ_BExLbP2C"
    );

    const $ = id => document.getElementById(id);

    const stageLobby = $("stage-lobby");
    const stageSearching = $("stage-searching");
    const stageMatch = $("stage-match");
    const btnStart = $("btn-start");
    const btnCancel = $("btn-cancel");
    const btnNext = $("btn-next");
    const btnExit = $("btn-exit");
    const countdownText = $("countdown");
    const scaleNeedle = $("scale-needle");
    const opponentNameTag = $("opponent-name");
    const userSlot = $("slot-user");
    const opponentSlot = $("slot-opponent");
    const userAuraText = $("user-aura-val");
    const oppAuraText = $("opp-aura-val");
    const resultText = $("result-text");
    const lobbyMsg = $("lobby-msg");
    const userVideo = $("user-video");
    const opponentVideo = $("opponent-video");
    const authButtonContainer = $("auth-button-container");

    const urlParams = new URLSearchParams(location.search);
    const privateRoomId = urlParams.get("room");
    const privateRole = urlParams.get("role");
    const linkedHostName = urlParams.get("hostName");

    let peer = null;
    let myPeerId = null;
    let currentConnection = null;
    let isHost = false;
    let activeQueueDocRef = null;
    let queueChannel = null;
    let inQueueProcess = false;
    let myMediaStream = null;
    let matchInterval = null;
    let timerInterval = null;
    let connectionTimeout = null;
    let currentScore = 50;
    let currentUserProfile = { id:null, username:"Unknown" };

    const MAX_AURA = 1000;

    function safelyStopCameraTracks(){
      if(myMediaStream){
        myMediaStream.getTracks().forEach(track => track.stop());
        myMediaStream = null;
      }
      userVideo.srcObject = null;
      opponentVideo.srcObject = null;
    }

    async function safeAcquireCameraStream(){
      if(myMediaStream){
        userVideo.srcObject = myMediaStream;
        return true;
      }

      if(!navigator.mediaDevices?.getUserMedia){
        console.error("getUserMedia is unavailable.");
        return false;
      }

      try{
        myMediaStream = await navigator.mediaDevices.getUserMedia({
          video:{
            width:{ideal:640},
            height:{ideal:480},
            frameRate:{ideal:24}
          },
          audio:false
        });

        userVideo.srcObject = myMediaStream;

        try{
          await userVideo.play();
        }catch(e){}

        return true;
      }catch(e){
        console.error("Camera acquisition failure:",e);
        return false;
      }
    }

    function switchStage(stage){
      [stageLobby,stageSearching,stageMatch].forEach(s => s.classList.remove("active"));
      stage.classList.add("active");
    }

    async function initPeerSession(){
      if(peer && !peer.destroyed) return;

      if(privateRoomId && privateRole === "host"){
        myPeerId = privateRoomId;
        isHost = true;
        peer = new Peer(privateRoomId);
      }else{
        peer = new Peer();
      }

      peer.on("open",id=>{
        if(!privateRoomId) myPeerId = id;
        if(privateRoomId && privateRole === "guest")
          executePrivateGuestHandshake();
      });

      peer.on("connection",conn=>{
        isHost = true;
        setupDataChannel(conn);
      });

      peer.on("call",incomingCall=>{
        if(myMediaStream){
          incomingCall.answer(myMediaStream);
          incomingCall.on("stream",stream=>{
            opponentVideo.srcObject = stream;
            opponentVideo.play().catch(()=>{});
          });
        }else{
          incomingCall.close();
        }
      });

      peer.on("error",err=>{
        console.error("PeerJS Error:",err);
        if(err.type === "unavailable-id")
          lobbyMsg.textContent = "Room ID already in use. Please try another.";
      });
    }

    async function renderAuthState(user){
      if(!authButtonContainer) return;

      if(!user){
        authButtonContainer.innerHTML =
          '<a href="../login/" class="nav-auth-btn">Sign In</a>';
        authButtonContainer.style.display = "";
        return;
      }

      currentUserProfile.id = user.id;

      const {data:userSnap} = await supabase
        .from("users")
        .select("username")
        .eq("id",user.id)
        .single();

      currentUserProfile.username =
        userSnap?.username ||
        user.email?.split("@")[0] ||
        "Player";

      authButtonContainer.innerHTML =
        '<a id="logout-btn" href="#" class="nav-auth-btn">Logout</a>';

      authButtonContainer.style.display = "";

      $("logout-btn")?.addEventListener("click",async e=>{
        e.preventDefault();
        safelyStopCameraTracks();
        if(peer && !peer.destroyed) peer.destroy();
        await supabase.auth.signOut();
        location.reload();
      });

      if(privateRoomId){
        switchStage(stageMatch);
        const acquired = await safeAcquireCameraStream();

        if(!acquired){
          lobbyMsg.textContent = "Camera access is required for Omoggle.";
          return;
        }

        opponentNameTag.textContent =
          linkedHostName
            ? decodeURIComponent(linkedHostName)
            : privateRole === "host" ? "Challenger" : "Host";
      }

      await initPeerSession();
    }

    supabase.auth.onAuthStateChange(async(_,session)=>{
      await renderAuthState(session?.user || null);
    });

    const initialSession = await supabase.auth.getSession();
    await renderAuthState(initialSession.data.session?.user || null);

    async function executePrivateGuestHandshake(){
      switchStage(stageMatch);

      if(!(await safeAcquireCameraStream())){
        lobbyMsg.textContent = "Camera access is required for Omoggle.";
        return;
      }

      isHost = false;
      const conn = peer.connect(privateRoomId);
      setupDataChannel(conn);
    }

    async function startMatchmaking(){
      if(privateRoomId || inQueueProcess || !myPeerId) return;

      if(!currentUserProfile.id){
        lobbyMsg.textContent = "Please sign in to queue for a match.";
        return;
      }

      inQueueProcess = true;

      if(!(await safeAcquireCameraStream())){
        lobbyMsg.textContent = "Camera initialization failed. Please verify browser settings.";
        inQueueProcess = false;
        return;
      }

      switchStage(stageSearching);

      try{
        const {data:queueItems,error:queueError} = await supabase
          .from("showdown_queue")
          .select("*")
          .eq("status","waiting")
          .neq("hostuid",currentUserProfile.id)
          .order("createdat",{ascending:true})
          .limit(5);

        if(queueError) throw queueError;

        const selectedDoc = queueItems?.[0];

        if(selectedDoc){
          const {data:matchedRows,error:matchError} = await supabase
            .from("showdown_queue")
            .update({
              status:"matched",
              guestpeerid:myPeerId,
              guestuid:currentUserProfile.id,
              guestname:currentUserProfile.username
            })
            .eq("id",selectedDoc.id)
            .eq("status","waiting")
            .select();

          if(matchError) throw matchError;

          if(matchedRows?.length){
            const row = matchedRows[0];

            isHost = false;
            opponentNameTag.textContent = row.hostname || "Player";

            if(queueChannel){
              await supabase.removeChannel(queueChannel);
              queueChannel = null;
            }

            setupDataChannel(peer.connect(row.hostpeerid));
            inQueueProcess = false;
            return;
          }
        }

        isHost = true;

        const {data:newQueueItem,error:insertError} = await supabase
          .from("showdown_queue")
          .insert([{
            status:"waiting",
            hostpeerid:myPeerId,
            hostuid:currentUserProfile.id,
            hostname:currentUserProfile.username,
            guestpeerid:"",
            guestuid:null,
            guestname:"",
            createdat:Date.now()
          }])
          .select()
          .single();

        if(insertError) throw insertError;

        if(newQueueItem){
          activeQueueDocRef = newQueueItem.id;

          if(queueChannel)
            await supabase.removeChannel(queueChannel);

          queueChannel = supabase
            .channel(`showdown_queue_${newQueueItem.id}`)
            .on(
              "postgres_changes",
              {
                event:"UPDATE",
                schema:"public",
                table:"showdown_queue",
                filter:`id=eq.${newQueueItem.id}`
              },
              async payload=>{
                const d = payload.new;

                if(d?.status !== "matched") return;

                opponentNameTag.textContent = d.guestname || "Player";

                if(queueChannel){
                  await supabase.removeChannel(queueChannel);
                  queueChannel = null;
                }

                activeQueueDocRef = null;

                setupDataChannel(peer.connect(d.guestpeerid));
              }
            )
            .subscribe();
        }
      }catch(err){
        console.error("Matchmaking error:",err);
        lobbyMsg.textContent = "Unable to enter matchmaking. Please try again.";
        await cancelSearch();
      }

      inQueueProcess = false;
    }

    async function cancelSearch(){
      if(queueChannel){
        await supabase.removeChannel(queueChannel);
        queueChannel = null;
      }

      if(activeQueueDocRef){
        await supabase
          .from("showdown_queue")
          .delete()
          .eq("id",activeQueueDocRef);

        activeQueueDocRef = null;
      }

      if(currentConnection){
        currentConnection.close();
        currentConnection = null;
      }

      clearLoops();
      safelyStopCameraTracks();
      inQueueProcess = false;
      switchStage(stageLobby);
    }

    function setupDataChannel(conn){
      if(currentConnection && currentConnection !== conn)
        currentConnection.close();

      currentConnection = conn;

      clearTimeout(connectionTimeout);

      connectionTimeout = setTimeout(()=>{
        if(!currentConnection?.open){
          console.warn("P2P connection timeout");
          cancelSearch();
        }
      },15000);

      currentConnection.on("open",()=>{
        clearTimeout(connectionTimeout);

        currentConnection.send({
          type:"init_name",
          username:currentUserProfile.username
        });

        if(!isHost && myMediaStream){
          const call = peer.call(conn.peer,myMediaStream);

          call.on("stream",stream=>{
            opponentVideo.srcObject = stream;
            opponentVideo.play().catch(()=>{});
          });
        }

        runShowdownEngine();
      });

      currentConnection.on("data",data=>{
        if(!data || typeof data !== "object") return;

        if(data.type === "init_name"){
          opponentNameTag.textContent =
            String(data.username || "Player").slice(0,32);
        }

        if(data.type === "sync_score"){
          currentScore = Math.max(
            0,
            Math.min(100,Number(data.score) || 0)
          );
          renderUIFrames();
        }
      });

      currentConnection.on("close",()=>{
        clearLoops();
        safelyStopCameraTracks();
        switchStage(stageLobby);
      });

      currentConnection.on("error",err=>{
        console.error("Data channel error:",err);
        cancelSearch();
      });
    }

    function runShowdownEngine(){
      switchStage(stageMatch);

      countdownText.style.display = "block";
      resultText.style.display = "none";
      btnNext.style.display = "none";
      btnExit.style.display = "none";

      currentScore = 50;
      scaleNeedle.style.left = "50%";
      renderUIFrames();

      let timeLeft = 15;
      countdownText.textContent = "15s";

      clearLoops();

      timerInterval = setInterval(()=>{
        timeLeft--;
        countdownText.textContent = `${Math.max(0,timeLeft)}s`;

        if(timeLeft <= 0)
          terminateShowdown();
      },1000);

      matchInterval = setInterval(()=>{
        if(!isHost || !currentConnection?.open) return;

        currentScore = Math.max(
          0,
          Math.min(
            100,
            Number(AuraEngine.calculateMatchFlux(currentScore)) || 0
          )
        );

        currentConnection.send({
          type:"sync_score",
          score:currentScore
        });

        renderUIFrames();
      },350);
    }

    function renderUIFrames(){
      currentScore = Math.max(
        0,
        Math.min(100,Number(currentScore) || 0)
      );

      let calculatedPos = isHost ? currentScore : 100-currentScore;
      calculatedPos = Math.max(0,Math.min(100,calculatedPos));

      const userAura = Math.max(
        0,
        Math.min(MAX_AURA,Math.round((100-calculatedPos)*10))
      );

      const opponentAura = Math.max(
        0,
        Math.min(MAX_AURA,Math.round(calculatedPos*10))
      );

      scaleNeedle.style.left = `${calculatedPos}%`;
      userAuraText.textContent = `Aura: +${userAura}`;
      oppAuraText.textContent = `Aura: +${opponentAura}`;

      userSlot.classList.toggle("winning",calculatedPos < 48);
      opponentSlot.classList.toggle("winning",calculatedPos > 52);
    }

    function terminateShowdown(){
      if(timerInterval === null && matchInterval === null) return;

      clearLoops();

      countdownText.style.display = "none";
      resultText.style.display = "block";
      btnExit.style.display = "inline-flex";

      if(!privateRoomId)
        btnNext.style.display = "inline-flex";

      let finalPosition = isHost ? currentScore : 100-currentScore;
      finalPosition = Math.max(0,Math.min(100,Number(finalPosition) || 0));

      let phrases = OUTCOME_PHRASES.tie;

      if(finalPosition < 20) phrases = OUTCOME_PHRASES.wonByATon;
      else if(finalPosition < 40) phrases = OUTCOME_PHRASES.won;
      else if(finalPosition < 48) phrases = OUTCOME_PHRASES.barelyWon;
      else if(finalPosition > 52 && finalPosition <= 60) phrases = OUTCOME_PHRASES.barelyLost;
      else if(finalPosition > 60 && finalPosition <= 80) phrases = OUTCOME_PHRASES.lost;
      else if(finalPosition > 80) phrases = OUTCOME_PHRASES.lostByATon;

      resultText.textContent =
        phrases[Math.floor(Math.random()*phrases.length)];

      resultText.style.color =
        finalPosition < 48
          ? "var(--accent)"
          : finalPosition > 52
            ? "#ef4444"
            : "var(--text-muted)";
    }

    function clearLoops(){
      clearInterval(timerInterval);
      clearInterval(matchInterval);
      timerInterval = null;
      matchInterval = null;
    }

    async function cleanExit(){
      clearLoops();

      if(queueChannel){
        await supabase.removeChannel(queueChannel);
        queueChannel = null;
      }

      if(activeQueueDocRef){
        await supabase
          .from("showdown_queue")
          .delete()
          .eq("id",activeQueueDocRef);
        activeQueueDocRef = null;
      }

      if(currentConnection){
        currentConnection.close();
        currentConnection = null;
      }

      if(peer && !peer.destroyed)
        peer.destroy();

      safelyStopCameraTracks();

      location.href = privateRoomId ? "../chat/" : "../";
    }

    btnStart.addEventListener("click",startMatchmaking);
    btnCancel.addEventListener("click",cancelSearch);

    btnNext.addEventListener("click",async()=>{
      clearLoops();
      safelyStopCameraTracks();

      if(currentConnection){
        currentConnection.close();
        currentConnection = null;
      }

      await startMatchmaking();
    });

    btnExit.addEventListener("click",cleanExit);

    window.addEventListener("pagehide",()=>{
      clearLoops();
      safelyStopCameraTracks();

      if(currentConnection)
        currentConnection.close();

      if(peer && !peer.destroyed)
        peer.destroy();
    });
  </script>
</body>
</html>
